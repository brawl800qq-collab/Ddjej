name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -q kubomir.zip
      - name: Export preset
        working-directory: kubomir
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          script_export_mode=2

          [preset.0.options]
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.kubomir.game"
          package/name="Кубомир"
          package/signed=true
          permissions/internet=true
          EOF
      - name: Setup Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          cp /root/.config/godot/* ~/.config/godot/ 2>/dev/null || true
          SDK="${ANDROID_HOME:-$(ls -d /usr/lib/android-sdk /root/android-sdk /opt/android-sdk 2>/dev/null | head -1)}"
          JDK="${JAVA_HOME:-$(ls -d /usr/lib/jvm/java-17-openjdk-* 2>/dev/null | head -1)}"
          echo "SDK=$SDK JDK=$JDK"
          ls "$SDK/build-tools" "$SDK/platforms" || true
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          EOF
      - name: Keystore
        run: |
          [ -f /root/debug.keystore ] || keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
      - name: Build
        working-directory: kubomir
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/kubomir.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kubomir-apk
          path: kubomir/build/kubomir.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: kubomir/build/kubomir.apk
